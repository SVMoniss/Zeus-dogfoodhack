# Azure free-tier deploy: Container Apps (API) + Static Web Apps (web) + Neon (DB)
#
# One-time setup (see AZURE-DEPLOY.md):
#   - Resource group exists (e.g. `az group create -n dogfood-rg -l westeurope`)
#   - Federated credential for azure/login (secrets AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID)
#   - Secrets NEON_DATABASE_URL (non-pooled URI) and AZURE_SECRET_KEY (stable, openssl rand -hex 32)
#   - ghcr.io package dogfood-backend set to public (or add a registry secret)
#
# Flow: build + push backend image -> Bicep infra (uses that image tag) ->
# SWA deploy with NEXT_PUBLIC_API_URL pointing at the fresh backend FQDN.
name: azure-deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'infra/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: dogfood-rg
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

permissions:
  id-token: write # azure/login with federated credentials
  contents: read
  packages: write # push backend image to ghcr.io

jobs:
  backend-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: ${{ steps.meta.outputs.image }}

  infra:
    runs-on: ubuntu-latest
    needs: backend-image
    outputs:
      backendFqdn: ${{ steps.out.outputs.backendFqdn }}
      swaApiToken: ${{ steps.out.outputs.swaApiToken }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: >
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --template-file infra/main.bicep
          --parameters "infra/main.bicepparam"
          --parameters "backendImage=${{ needs.backend-image.outputs.image }}"
          --parameters "databaseUrl=${{ secrets.NEON_DATABASE_URL }}"
          --parameters "secretKey=${{ secrets.AZURE_SECRET_KEY }}"

      - id: out
        name: Read deployment outputs
        run: |
          echo "backendFqdn=$(az deployment group show -g "$RESOURCE_GROUP" -n main --query properties.outputs.backendFqdn.value -o tsv)" >> "$GITHUB_OUTPUT"
          echo "swaApiToken=$(az deployment group show -g "$RESOURCE_GROUP" -n main --query properties.outputs.swaApiToken.value -o tsv)" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.infra.outputs.swaApiToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          output_location: .next
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.infra.outputs.backendFqdn }}
