services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dogfood:dogfood@postgres:5432/dogfood
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:3000
      PYTHONPATH: /app
      PYTHONFAULTHANDLER: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
    command: >
      sh -c "uv run python seed.py &&
             uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # Inotify events don't cross the Windows bind mount, so poll for
      # changes — otherwise `next dev` serves stale compiled pages.
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    command: sh -c "npm run dev -- -H 0.0.0.0 -p 3000"

  seed:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: postgresql+asyncpg://dogfood:dogfood@postgres:5432/dogfood
      FIXTURES_PATH: /app/fixtures.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./fixtures.json:/app/fixtures.json:ro
    profiles:
      - seed

volumes:
  postgres_data: