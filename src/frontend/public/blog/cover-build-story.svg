<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="3D trophy podium cover">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="b-step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="b-step2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="b-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b-orb" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#b-bg)"/>
  <circle cx="700" cy="70" r="120" fill="#fbbf24" opacity="0.12"/>
  <circle cx="90" cy="380" r="100" fill="#fb7185" opacity="0.12"/>
  <ellipse cx="400" cy="400" rx="270" ry="24" fill="url(#b-shadow)"/>
  <!-- podium steps -->
  <g>
    <polygon points="180,330 300,330 300,400 180,400" fill="url(#b-step)"/>
    <polygon points="180,330 300,330 260,310 140,310" fill="#c4b5fd"/>
    <polygon points="500,330 620,330 620,400 500,400" fill="url(#b-step2)"/>
    <polygon points="500,330 620,330 580,310 460,310" fill="#fda4af"/>
    <polygon points="320,280 480,280 480,400 320,400" fill="url(#b-gold)"/>
    <polygon points="320,280 480,280 440,258 280,258" fill="#fef3c7"/>
  </g>
  <!-- trophy cup -->
  <g>
    <path d="M350 90 h100 v55 c0 34 -22 58 -50 62 -28 -4 -50 -28 -50 -62 z" fill="url(#b-gold)"/>
    <path d="M350 84 h100 v10 h-100 z" fill="#fef3c7"/>
    <path d="M350 100 c-20 2 -34 16 -34 36 c0 22 20 38 44 38" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
    <path d="M450 100 c20 2 34 16 34 36 c0 22 -20 38 -44 38" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
    <rect x="392" y="205" width="16" height="26" rx="4" fill="#b45309"/>
    <rect x="372" y="231" width="56" height="12" rx="6" fill="url(#b-gold)"/>
    <path d="M400 30 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 z" fill="#fef3c7"/>
  </g>
  <!-- confetti + orbs -->
  <circle cx="180" cy="140" r="22" fill="url(#b-orb)"/>
  <circle cx="620" cy="170" r="15" fill="url(#b-orb)"/>
  <g fill="#fbbf24" opacity="0.9">
    <rect x="250" y="120" width="14" height="14" rx="3" transform="rotate(24 257 127)"/>
    <rect x="540" y="100" width="12" height="12" rx="3" transform="rotate(-18 546 106)"/>
  </g>
  <g fill="#fb7185" opacity="0.9">
    <rect x="300" y="70" width="12" height="12" rx="3" transform="rotate(-30 306 76)"/>
    <rect x="480" y="150" width="14" height="14" rx="3" transform="rotate(40 487 157)"/>
  </g>
  <circle cx="680" cy="300" r="9" fill="#c4b5fd"/>
  <circle cx="120" cy="240" r="8" fill="#fda4af"/>
</svg>
