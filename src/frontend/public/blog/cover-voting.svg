<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="3D ballot box cover">
  <defs>
    <linearGradient id="v-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a1e"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="v-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="v-token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="v-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#v-bg)"/>
  <circle cx="110" cy="100" r="110" fill="#fb7185" opacity="0.14"/>
  <circle cx="710" cy="360" r="100" fill="#fdba74" opacity="0.14"/>
  <ellipse cx="400" cy="398" rx="260" ry="24" fill="url(#v-shadow)"/>
  <!-- ballot box -->
  <g>
    <polygon points="300,200 500,200 460,170 260,170" fill="#fecdd3"/>
    <rect x="300" y="200" width="200" height="190" fill="url(#v-box)"/>
    <rect x="300" y="200" width="200" height="190" fill="none" stroke="#ffe4e6" stroke-width="3" opacity="0.6"/>
    <rect x="370" y="170" width="60" height="16" rx="8" fill="#4c0519"/>
    <circle cx="400" cy="300" r="44" fill="#4c0519"/>
    <path d="M382 300 l13 13 24 -28" fill="none" stroke="#fdba74" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- flying vote tokens -->
  <g>
    <g transform="rotate(-18 220 180)">
      <rect x="170" y="150" width="100" height="64" rx="10" fill="url(#v-token)"/>
      <path d="M192 182 l10 10 18 -22" fill="none" stroke="#be123c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(14 590 160)">
      <rect x="540" y="130" width="100" height="64" rx="10" fill="url(#v-token)"/>
      <path d="M562 162 l10 10 18 -22" fill="none" stroke="#be123c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-8 640 280)">
      <rect x="600" y="250" width="84" height="54" rx="10" fill="url(#v-token)" opacity="0.9"/>
      <circle cx="642" cy="277" r="12" fill="none" stroke="#be123c" stroke-width="6"/>
    </g>
  </g>
  <g font-family="monospace" font-size="22" font-weight="bold">
    <rect x="120" y="300" width="120" height="44" rx="10" fill="#ffffff" opacity="0.92"/>
    <text x="180" y="330" text-anchor="middle" fill="#9d174d">1×vote</text>
  </g>
  <circle cx="250" cy="90" r="9" fill="#fdba74"/>
  <circle cx="560" cy="80" r="8" fill="#fecdd3"/>
  <circle cx="700" cy="120" r="6" fill="#fb7185"/>
</svg>
