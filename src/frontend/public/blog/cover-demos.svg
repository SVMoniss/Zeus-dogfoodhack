<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="3D demo play cover">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1206"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="d-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfccb"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="d-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#431407"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="d-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-gloss" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#d-bg)"/>
  <circle cx="100" cy="360" r="100" fill="#f59e0b" opacity="0.14"/>
  <ellipse cx="400" cy="402" rx="270" ry="22" fill="url(#d-shadow)"/>
  <!-- stacked film frames -->
  <g transform="rotate(-6 400 250)">
    <rect x="220" y="150" width="360" height="220" rx="18" fill="url(#d-frame)" opacity="0.7"/>
  </g>
  <g transform="rotate(4 400 250)">
    <rect x="220" y="150" width="360" height="220" rx="18" fill="#1c0a00" stroke="#fdba74" stroke-width="4"/>
    <rect x="240" y="170" width="320" height="150" rx="10" fill="#f59e0b" opacity="0.25"/>
    <circle cx="270" cy="345" r="8" fill="#fdba74"/>
    <circle cx="300" cy="345" r="8" fill="#fdba74"/>
    <circle cx="330" cy="345" r="8" fill="#fdba74"/>
    <rect x="470" y="336" width="70" height="18" rx="9" fill="#fdba74" opacity="0.8"/>
  </g>
  <!-- 3D play button -->
  <g>
    <ellipse cx="400" cy="290" rx="70" ry="14" fill="#000000" opacity="0.35"/>
    <circle cx="400" cy="245" r="58" fill="url(#d-play)"/>
    <circle cx="400" cy="245" r="58" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    <polygon points="382,215 382,275 432,245" fill="#3f6212"/>
  </g>
  <circle cx="180" cy="140" r="24" fill="url(#d-gloss)"/>
  <circle cx="630" cy="120" r="16" fill="url(#d-gloss)"/>
  <g font-family="monospace" font-size="22" font-weight="bold">
    <rect x="560" y="300" width="110" height="44" rx="10" fill="#ffffff" opacity="0.92"/>
    <text x="615" y="330" text-anchor="middle" fill="#c2410c">3:56 ▶</text>
  </g>
  <rect x="120" y="100" width="14" height="14" rx="3" fill="#fde68a" transform="rotate(24 127 107)"/>
  <rect x="680" y="220" width="12" height="12" rx="3" fill="#bef264" transform="rotate(-20 686 226)"/>
</svg>
