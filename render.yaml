# Render Blueprint — public playground deploy.
#
# DEPLOY (two steps, one chicken-and-egg: the frontend bakes the public
# backend URL into its build, so the backend must exist first):
#
#   Step 1. Push this repo to GitHub, then in Render: New > Blueprint,
#           point it at the repo. Everything below boots; the frontend
#           temporarily points at http://localhost:8000.
#   Step 2. Open the dogfood-backend dashboard, copy its public URL
#           (https://dogfood-backend-xxxx.onrender.com), then:
#             a) frontend service > Environment: set NEXT_PUBLIC_API_URL
#                to that URL (used at runtime where possible), and
#             b) edit render.yaml below: put the same URL in the frontend
#                buildArg, commit, push. Render rebuilds; you get the link.
#   Step 3 (optional). backend service > Environment: set FRONTEND_URL to
#           the frontend's public URL for strict CORS (defaults below work
#           until then only for same-origin; the app also needs the value
#           for links).
#
# Playground notes: the seed script recreates the fixture data and test
# users (organizer/judge_a/judge_b/participant, password testpass123) on
# every boot — anyone with the link can play organizer. Reset = redeploy.
# Free Postgres expires after the trial; upgrade it to keep data.

services:
  - type: psql
    name: dogfood-postgres
    plan: free
    pgVersion: "16"

  - type: web
    name: dogfood-backend
    runtime: docker
    plan: free
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    dockerCommand: >-
      sh -c "uv run python seed.py &&
             uv run alembic upgrade head &&
              uv run uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dogfood-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        # STEP 2 (optional hardening): replace with your frontend URL,
        # e.g. https://dogfood-frontend-xxxx.onrender.com
        value: http://localhost:3000
      - key: PYTHONPATH
        value: /app
      - key: PYTHONFAULTHANDLER
        value: "1"

  - type: web
    name: dogfood-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./src/frontend/Dockerfile
    dockerContext: ./src/frontend
    dockerCommand: sh -c "npm start -- -p ${PORT:-3000}"
    healthCheckPath: /
    buildArgs:
      # STEP 2 (required): your backend's public URL from Step 1, e.g.
      # https://dogfood-backend-xxxx.onrender.com
      NEXT_PUBLIC_API_URL: http://localhost:8000
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # Keep in sync with the buildArg above (runtime fallback).
        value: http://localhost:8000
